version: "2"

linters:
  default: none
  enable:
    # --- The Critical Checks (Gap Fixers) ---
    - errcheck # Catches your file.Close errors
    - gosec # Catches your G304 security issue
    - revive # Catches your missing comment issues
    - govet # Standard Go vetting
  settings:
    errcheck:
      exclude-functions:
        # Output is best-effort, as errcheck already treats fmt.Printf
        - fmt.Fprintf
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
  exclusions:
    paths:
      - third_party
      - builtin
      - examples
    rules:
      # Tests create files from temp-dir paths by design
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mikemadden42
